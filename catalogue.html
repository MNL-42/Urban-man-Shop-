<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Catalogue numéroté</title>
<style>
  body{margin:0;background:#050505;color:#fff;font-family:system-ui,sans-serif}
  h1{font-size:15px;margin:0;padding:12px 10px;background:#111;position:sticky;top:0;z-index:5}
  h1 small{display:block;font-weight:400;opacity:.65;margin-top:2px}
  #g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}
  .t{position:relative;aspect-ratio:1;background:#151515;overflow:hidden}
  .t img{width:100%;height:100%;object-fit:cover;display:block}
  .t b{position:absolute;left:0;bottom:0;background:#000d;color:#fff;font-size:20px;padding:2px 8px;border-top-right-radius:8px}
</style>
</head>
<body>
<h1>Catalogue numéroté (1 à 93)<small>Fais des captures d'écran en défilant, puis envoie-les-moi.</small></h1>
<div id="g"></div>
<script>
  const g = document.getElementById('g');
  for (let i = 1; i <= 93; i++) {
    const d = document.createElement('div'); d.className = 't';
    d.innerHTML = `<img src="./${i}.png" alt="${i}" onerror="this.style.display='none'"><b>${i}</b>`;
    g.appendChild(d);
  }
</script>
</body>
</html>
